name: Copilot → Auto Review

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  request_copilot_review:
    runs-on: ubuntu-latest

    steps:
      - name: Request GitHub Copilot Review
        uses: actions/github-script@v7
        with:
          script: |
            // Skip if already assigned
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            const existingReviewers = pr.data.requested_reviewers.map(r => r.login);
            if (!existingReviewers.includes("github-copilot")) {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                reviewers: ["github-copilot"],
              });
              core.info("Copilot review requested.");
            } else {
              core.info("Copilot already assigned. Skipping.");
            }
