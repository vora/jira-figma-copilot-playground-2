name: Component Workflow

on:
  repository_dispatch:
    types: [feature_component]

jobs:
  handle_component:
    runs-on: ubuntu-latest

    steps:
      - name: Use payload
        run: |
          echo "Processing component:"
          echo "Issue: ${{ github.event.client_payload.issueKey }}"
          echo "Summary: ${{ github.event.client_payload.summary }}"
          echo "Figma: ${{ github.event.client_payload.figma_link }}"