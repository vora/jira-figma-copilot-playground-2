name: Jira → Feature Generator

permissions:
  contents: write
  pull-requests: write
  id-token: write

on:
  repository_dispatch:
    types: [jira_issue_ready_for_dev]

jobs:
  generate_feature:
    runs-on: ubuntu-latest
    environment: figma-jam
    env:
      JIRA_WEBHOOK_SECRET: ${{ secrets.JIRA_WEBHOOK_SECRET }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:

      - name: Validate incoming webhook signature
        run: |
          echo "Webhook payload: $GITHUB_EVENT_PATH"
          cat "$GITHUB_EVENT_PATH"

      - name: Extract issue and Figma data
        id: extract
        run: |
          ISSUE_KEY=$(jq -r .client_payload.issueKey < "$GITHUB_EVENT_PATH")
          SUMMARY=$(jq -r .client_payload.summary < "$GITHUB_EVENT_PATH")
          DESCRIPTION=$(jq -r .client_payload.description < "$GITHUB_EVENT_PATH")
          FIGMA_URL=$(jq -r .client_payload.figma_link < "$GITHUB_EVENT_PATH")
          JIRA_LABEL=$(jq -r .client_payload.label < "$GITHUB_EVENT_PATH")
          COMPONENT_NAME=$(jq -r .client_payload.component_path < "$GITHUB_EVENT_PATH")

          echo "issue_key=$ISSUE_KEY" >> $GITHUB_OUTPUT

          echo "summary<<EOF" >> $GITHUB_OUTPUT
          echo "$SUMMARY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "description<<EOF" >> $GITHUB_OUTPUT
          echo "$DESCRIPTION" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "figma_url=$FIGMA_URL" >> $GITHUB_OUTPUT
          echo "jira_label=$JIRA_LABEL" >> $GITHUB_OUTPUT
          echo "component_name=$COMPONENT_NAME" >> $GITHUB_OUTPUT

          FILE_ID=$(echo "$FIGMA_URL" | grep -oP '(?<=design/|file/)[^/]+') || true
          NODE_ID=$(echo "$FIGMA_URL" | grep -oP '(?<=node-id=)[0-9:-]+') || true

          echo "figma_file_id=$FILE_ID" >> $GITHUB_OUTPUT
          echo "figma_node_id=$NODE_ID" >> $GITHUB_OUTPUT

      - name: Route based on label
        run: |
          LABEL="${{ steps.extract.outputs.jira_label }}"
          echo "Routing based on label: $LABEL"

          if [ "$LABEL" = "Feature-Component" ]; then
            EVENT="feature_component"
          elif [ "$LABEL" = "Feature-Screen" ]; then
            EVENT="feature_screen"
          else
            echo "Unknown label '$LABEL'. Skipping."
            exit 0
          fi

          echo "Dispatching $EVENT workflow..."

          payload=$(cat <<EOF
          {
            "event_type": "$EVENT",
            "client_payload": {
              "issueKey": "$issueKey",
              "summary": "$summary",
              "description": "$description",
              "figma_file_id": "$figmaFileId",
              "figma_node_id": "$figmaNodeId",
              "component_path": "$componentName"
            }
          }
          EOF
          )
          
          curl -X POST https://api.github.com/repos/${{ github.repository }}/dispatches \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          -d "$payload"

          

